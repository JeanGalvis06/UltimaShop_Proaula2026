<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enlace no válido — Ultima Shop</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="pagina-login">
<main class="login-contenedor">
    <section class="panel login-panel">
        <div class="panel-body">
            <span class="eyebrow">ACCESO</span>
            <h1 th:text="${tituloError} ?: 'Enlace no válido'">Enlace no válido</h1>
            <p class="help" th:text="${mensajeError} ?: 'El enlace no es válido, ya fue usado o venció.'">El enlace no es válido.</p>
            <div class="form-actions">
                <a class="primary" th:href="@{/login}">Ir al inicio de sesión</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
