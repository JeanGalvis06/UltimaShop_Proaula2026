<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña — Ultima Shop</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="pagina-login">
<main class="login-contenedor">
    <div class="login-marca">
        <span class="brand-mark"><svg class="icono" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="M3 8v9l9 5 9-5V8M12 13v9M7.5 5.5l9 5"/></svg></span>
        <div>
            <strong>ULTIMA SHOP</strong>
            <small>Recuperación de acceso</small>
        </div>
    </div>

    <section class="panel login-panel" aria-labelledby="recuperar-titulo">
        <div class="panel-body">
            <span class="eyebrow">CONTRASEÑA</span>
            <h1 id="recuperar-titulo">Olvidé mi contraseña</h1>
            <p class="help">Ingrese el correo asociado a su cuenta. Si está registrado, recibirá instrucciones para restablecer la contraseña.</p>

            <form th:action="@{/recuperar}" method="post" class="login-formulario">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="fields">
                    <label class="wide">
                        <span>Correo electrónico</span>
                        <input type="email" name="correo" autocomplete="email" required autofocus>
                    </label>
                </div>
                <div class="form-actions" style="justify-content:space-between;align-items:center;flex-wrap:wrap;">
                    <a class="text-button" th:href="@{/login}">Volver al inicio de sesión</a>
                    <button class="primary" type="submit">Enviar instrucciones</button>
                </div>
            </form>
        </div>
        <div class="panel-foot">
            <span>Por seguridad, la respuesta es la misma exista o no la cuenta.</span>
        </div>
    </section>
</main>
</body>
</html>
