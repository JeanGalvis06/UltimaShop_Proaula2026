<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security" data-theme="dark"
      th:fragment="pagina(titulo, activo, contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' — Ultima Shop'">Ultima Shop</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<svg class="iconos" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="i-inventory" viewBox="0 0 24 24">
        <path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="M3 8v9l9 5 9-5V8M12 13v9M7.5 5.5l9 5"/>
    </symbol>
    <symbol id="i-grid" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
    </symbol>
    <symbol id="i-cart" viewBox="0 0 24 24">
        <path d="M3 4h2l2.4 11h10.2l2.4-8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>
    </symbol>
    <symbol id="i-service" viewBox="0 0 24 24">
        <path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9"/>
    </symbol>
    <symbol id="i-history" viewBox="0 0 24 24">
        <path d="m17 2 4 4-4 4M3 12V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 12v3a3 3 0 0 1-3 3H3"/>
    </symbol>
    <symbol id="i-value" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"/><path d="M16 8h-6a2 2 0 0 0 0 4h4a2 2 0 0 1 0 4H8M12 6v12"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24">
        <path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v4M12 17h.01"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 11.5-2L20 8M4 16l2.5 3A7 7 0 0 0 18 17"/>
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
</svg>

<div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Barra lateral">
        <a class="brand" th:href="@{/dashboard}">
            <span class="brand-mark"><svg class="icono"><use href="#i-inventory"></use></svg></span>
            <span>ULTIMA<span class="brand-sub">SHOP</span><i class="brand-line"></i></span>
        </a>
        <nav aria-label="Módulos principales">
            <a class="nav-item" th:classappend="${activo == 'dashboard'} ? 'active'"
               th:attr="aria-current=${activo == 'dashboard'} ? 'page' : null"
               th:href="@{/dashboard}">
                <svg class="icono"><use href="#i-grid"></use></svg>Dashboard
            </a>
            <a class="nav-item" th:classappend="${activo == 'ventas'} ? 'active'"
               th:attr="aria-current=${activo == 'ventas'} ? 'page' : null"
               th:href="@{/ventas}">
                <svg class="icono"><use href="#i-cart"></use></svg>Ventas
            </a>
            <a class="nav-item" th:classappend="${activo == 'inventario'} ? 'active'"
               th:attr="aria-current=${activo == 'inventario'} ? 'page' : null"
               th:href="@{/inventario}">
                <svg class="icono"><use href="#i-inventory"></use></svg>Inventario
            </a>
            <a class="nav-item" th:classappend="${activo == 'servicios'} ? 'active'"
               th:attr="aria-current=${activo == 'servicios'} ? 'page' : null"
               th:href="@{/servicios}">
                <svg class="icono"><use href="#i-service"></use></svg>Servicios
            </a>
            <a class="nav-item" th:classappend="${activo == 'movimientos'} ? 'active'"
               th:attr="aria-current=${activo == 'movimientos'} ? 'page' : null"
               th:href="@{/movimientos}">
                <svg class="icono"><use href="#i-history"></use></svg>Movimientos
            </a>
            <a class="nav-item" sec:authorize="hasRole('ADMIN')"
               th:classappend="${activo == 'usuarios'} ? 'active'"
               th:attr="aria-current=${activo == 'usuarios'} ? 'page' : null"
               th:href="@{/usuarios}">
                <svg class="icono"><use href="#i-value"></use></svg>Usuarios
            </a>
            <a class="nav-item" th:classappend="${activo == 'perfil'} ? 'active'"
               th:attr="aria-current=${activo == 'perfil'} ? 'page' : null"
               th:href="@{/perfil}">
                <svg class="icono"><use href="#i-plus"></use></svg>Perfil
            </a>
        </nav>
        <div class="sidebar-bottom">
            <span>Gestor de inventario, ventas y servicios</span>
            <small sec:authorize="hasRole('ADMIN')">Acceso de administrador.</small>
            <small sec:authorize="hasRole('OPERADOR')">Acceso de operador.</small>
            <a class="text-button" th:href="@{/modulos}">Ver módulos</a>
            <span class="sidebar-version">Ultima Shop · v0.4</span>
        </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

    <div class="main">
        <header class="topbar">
            <button class="topbar-hamburger" type="button" data-sidebar-toggle
                    aria-label="Abrir menú de módulos" aria-controls="sidebar" aria-expanded="false">☰</button>
            <span class="topbar-greeting">Ultima Shop <strong th:text="${titulo}">Dashboard</strong></span>
            <div class="topbar-right">
                <span class="topbar-module" th:text="${titulo}">Dashboard</span>
                <sec:authorize access="isAuthenticated()">
                    <a class="text-button" th:href="@{/perfil}">Mi perfil</a>
                    <span class="topbar-user" title="Usuario autenticado"
                          sec:authentication="name">usuario</span>
                    <form th:action="@{/logout}" method="post" class="logout-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="text-button" type="submit">Cerrar sesión</button>
                    </form>
                </sec:authorize>
            </div>
        </header>
        <main class="content" th:replace="${contenido}">Contenido</main>
    </div>
</div>

<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
