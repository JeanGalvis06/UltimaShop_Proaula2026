spring.application.name=ultima-shop-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.error.include-stacktrace=never
server.error.include-message=never

# La cookie viaja solo por HTTPS en produccion. Para HTTP local dejar COOKIE_SECURE=false.
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Provisional hasta que el worker de Lewis entregue el resumen asincrono.
ultimashop.dashboard.fuente=tablas

# Brevo (correo transaccional). Si faltan credenciales o MAIL_ENABLED=false no se envian correos reales.
ultimashop.correo.enabled=${MAIL_ENABLED:false}
ultimashop.correo.brevo.api-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
ultimashop.correo.brevo.api-key=${BREVO_API_KEY:}
ultimashop.correo.from.email=${MAIL_FROM_EMAIL:}
ultimashop.correo.from.name=${MAIL_FROM_NAME:Ultima Shop}
ultimashop.correo.base-url=${APP_BASE_URL:http://localhost:8080}
ultimashop.correo.timeout.connect-ms=${MAIL_CONNECT_TIMEOUT_MS:3000}
ultimashop.correo.timeout.read-ms=${MAIL_READ_TIMEOUT_MS:5000}

# Tokens de acceso
ultimashop.seguridad.token.invitacion-horas=${INVITACION_TOKEN_HORAS:24}
ultimashop.seguridad.token.recuperacion-minutos=${RECUPERACION_TOKEN_MINUTOS:30}

# Solo confiar en X-Forwarded-For detrás de un proxy inverso de confianza.
ultimashop.seguridad.confia-proxy-inversa=${TRUST_PROXY_HEADERS:false}

# Limites de intentos/solicitudes (por ventana)
ultimashop.seguridad.limite.login.max-cuenta=${LOGIN_MAX_CUENTA:5}
ultimashop.seguridad.limite.login.max-ip=${LOGIN_MAX_IP:15}
ultimashop.seguridad.limite.login.ventana-minutos=${LOGIN_VENTANA_MINUTOS:15}
ultimashop.seguridad.limite.recuperacion.max-cuenta=${RECUPERACION_MAX_CUENTA:3}
ultimashop.seguridad.limite.recuperacion.max-ip=${RECUPERACION_MAX_IP:10}
ultimashop.seguridad.limite.recuperacion.ventana-minutos=${RECUPERACION_VENTANA_MINUTOS:30}
ultimashop.seguridad.limite.invitacion.max-cuenta=${INVITACION_MAX_CUENTA:5}
ultimashop.seguridad.limite.invitacion.max-ip=${INVITACION_MAX_IP:20}
ultimashop.seguridad.limite.invitacion.ventana-minutos=${INVITACION_VENTANA_MINUTOS:60}

