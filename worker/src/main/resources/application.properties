spring.application.name=ultima-shop-worker
server.port=${SERVER_PORT:8082}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER}
spring.rabbitmq.password=${RABBIT_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=5000
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.missing-queues-fatal=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
worker.publicador.enabled=${PUBLICADOR_ENABLED:true}
worker.consumidores.enabled=${CONSUMIDORES_ENABLED:true}
worker.publicador.delay-ms=${PUBLICADOR_DELAY_MS:2000}
