# Overlay: first file MUST be local-dev/compose.yaml (see docs/ENTREGA_DEVOPS.md).
# Relative build paths below are resolved from local-dev/, the first file's folder.
services:
  api:
    image: ultimashop-api:local
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_DOCKER_PORT:-8081}:8080"
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-ultimashop_dev}
      DB_USER: ${DB_USER:-ultimashop_app}
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en local-dev/.env}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_ADMIN_NAME: ${APP_ADMIN_NAME:-}
      MAIL_ENABLED: "false"
      COOKIE_SECURE: "false"
      APP_BASE_URL: http://localhost:${API_DOCKER_PORT:-8081}
    depends_on:
      postgres:
        condition: service_healthy
